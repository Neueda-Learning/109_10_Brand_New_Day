<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayBank Business - Operations</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../frontend-shared/design-tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="container-fluid px-3 py-2 d-flex align-items-center justify-content-between">
      <span class="brand"><i class="bi bi-bank"></i> PayBank Business</span>
      <div class="d-flex align-items-center gap-3">
        <div class="mode-toggle-group">
          <span>Demo</span>
          <div class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" role="switch" id="mode-toggle">
          </div>
          <span>Debug</span>
        </div>
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" role="switch" id="theme-toggle">
          <label class="form-check-label" for="theme-toggle"><i class="bi bi-moon-stars"></i></label>
        </div>
      </div>
    </div>
  </header>

  <main class="container-fluid py-4 px-4">
    <!-- KPI cards -->
    <section class="row g-3 mb-4" id="insight-cards">
      <div class="col-6 col-md-3">
        <div class="card insight-card">
          <div class="insight-label">Total Payments</div>
          <div class="insight-value" id="insight-total-payments">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card insight-card">
          <div class="insight-label">Total Amount</div>
          <div class="insight-value" id="insight-total-amount">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card insight-card">
          <div class="insight-label">Pending Approval</div>
          <div class="insight-value" id="insight-pending-approval">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card insight-card">
          <div class="insight-label">Success Rate</div>
          <div class="insight-value" id="insight-success-rate">-</div>
        </div>
      </div>
    </section>

    <!-- Filters -->
    <section class="card mb-4">
      <form id="filter-form" class="row g-3 align-items-end">
        <div class="col-md-2">
          <label for="status" class="form-label">Status</label>
          <select id="status" class="form-select">
            <option value="">Any</option>
            <option value="CREATED">CREATED</option>
            <option value="VALIDATED">VALIDATED</option>
            <option value="SENT">SENT</option>
            <option value="COMPLETED">COMPLETED</option>
            <option value="FAILED">FAILED</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="type" class="form-label">Type</label>
          <select id="type" class="form-select">
            <option value="">Any</option>
            <option value="PAYMENT">PAYMENT</option>
            <option value="REFUND">REFUND</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="sourceAccount" class="form-label">Source Account</label>
          <input type="text" id="sourceAccount" class="form-control">
        </div>
        <div class="col-md-2">
          <label for="destinationAccount" class="form-label">Destination Account</label>
          <input type="text" id="destinationAccount" class="form-control">
        </div>
        <div class="col-md-2">
          <label for="fromDate" class="form-label">From Date</label>
          <input type="date" id="fromDate" class="form-control">
        </div>
        <div class="col-md-2">
          <label for="toDate" class="form-label">To Date</label>
          <input type="date" id="toDate" class="form-control">
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> Search</button>
          <button type="button" id="reset-filters-btn" class="btn btn-outline-secondary btn-sm">Reset</button>
        </div>
      </form>
    </section>

    <!-- Results table -->
    <section class="card">
      <div id="results-error" class="error-message" hidden></div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Type</th>
              <th>Source</th>
              <th>Destination</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Approval</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
      <nav class="d-flex justify-content-between align-items-center">
        <span class="text-muted small" id="results-summary"></span>
        <div>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="prev-page-btn">Previous</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="next-page-btn">Next</button>
        </div>
      </nav>
    </section>
  </main>

  <!-- Detail offcanvas -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="detail-offcanvas">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">Payment Detail</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div id="detail-fields" class="small mb-3"></div>
      <div id="approval-actions" class="mb-3"></div>
      <h6>Lifecycle</h6>
      <div id="detail-timeline"></div>
      <div id="detail-inspector" class="mt-3"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../frontend-shared/app-mode.js"></script>
  <script src="../frontend-shared/lifecycle-timeline.js"></script>
  <script src="script.js"></script>
</body>
</html>

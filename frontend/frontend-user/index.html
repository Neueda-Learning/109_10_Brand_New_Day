<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayBank - Payments</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../frontend-shared/design-tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="container-fluid px-3 py-2 d-flex align-items-center justify-content-between">
      <span class="brand"><i class="bi bi-wallet2"></i> PayBank</span>
      <div class="d-flex align-items-center gap-3">
        <span class="customer-name d-none d-sm-inline">Customer: <strong id="customer-name">Kishore</strong></span>
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" role="switch" id="theme-toggle">
          <label class="form-check-label" for="theme-toggle"><i class="bi bi-moon-stars"></i></label>
        </div>
      </div>
    </div>
  </header>

  <main class="container py-4">
    <!-- Insight cards -->
    <section class="row g-3 mb-4" id="insight-cards">
      <div class="col-6 col-md-3">
        <div class="card insight-card">
          <div class="insight-label">Total Payments</div>
          <div class="insight-value" id="insight-total-payments">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card insight-card">
          <div class="insight-label">Total Amount</div>
          <div class="insight-value" id="insight-total-amount">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card insight-card">
          <div class="insight-label">Refunds</div>
          <div class="insight-value" id="insight-total-refunds">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card insight-card">
          <div class="insight-label">Success Rate</div>
          <div class="insight-value" id="insight-success-rate">-</div>
        </div>
      </div>
    </section>

    <!-- New Payment -->
    <section class="card mb-4">
      <div class="d-flex align-items-center justify-content-between" data-bs-toggle="collapse" href="#new-payment-body" role="button" aria-expanded="true" aria-controls="new-payment-body">
        <h2 class="h5 mb-0"><i class="bi bi-send-fill"></i> New Payment</h2>
        <i class="bi bi-chevron-down"></i>
      </div>
      <div class="collapse show mt-3" id="new-payment-body">
        <form id="new-payment-form">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="sourceAccount" class="form-label">Source Account</label>
              <input type="text" class="form-control" id="sourceAccount" required>
            </div>
            <div class="col-md-6">
              <label for="destinationAccount" class="form-label">Destination Account</label>
              <input type="text" class="form-control" id="destinationAccount" required>
            </div>
            <div class="col-md-8">
              <label for="amount" class="form-label">Amount (INR)</label>
              <input type="number" class="form-control" id="amount" step="0.01" min="0.01" required>
            </div>
            <div class="col-md-4">
              <label for="currency" class="form-label">Currency</label>
              <input type="text" class="form-control" id="currency" value="INR" maxlength="3" required>
            </div>
          </div>
          <div id="form-error" class="error-message mt-3" hidden></div>
          <button type="submit" class="btn btn-primary mt-3"><i class="bi bi-arrow-right-circle"></i> Pay</button>
        </form>
      </div>
    </section>

    <!-- Recent Transactions -->
    <section>
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0"><i class="bi bi-clock-history"></i> Recent Transactions</h2>
        <div class="d-flex align-items-center gap-2">
          <input
            type="text"
            class="form-control form-control-sm search-box"
            id="search-uuid"
            placeholder="Search by UUID..."
            style="max-width: 200px;">
          <select class="form-select form-select-sm" id="filter-status" style="max-width: 150px;">
            <option value="">All Status</option>
            <option value="CREATED">CREATED</option>
            <option value="VALIDATED">VALIDATED</option>
            <option value="SENT">SENT</option>
            <option value="COMPLETED">COMPLETED</option>
            <option value="FAILED">FAILED</option>
            <option value="CANCELLED">CANCELLED</option>
            <option value="REFUNDED">REFUNDED</option>
          </select>
        </div>
      </div>
      <div id="transactions-error" class="error-message" hidden></div>
      <div class="list-group" id="transactions-list"></div>
      <div class="text-center mt-3">
        <button type="button" class="btn btn-outline-secondary btn-sm" id="load-more-btn">Load more</button>
      </div>
    </section>
  </main>

  <template id="transaction-item-template">
    <div class="list-group-item transaction-item">
      <div class="d-flex align-items-center justify-content-between transaction-summary" role="button">
        <div class="d-flex align-items-center gap-2">
          <i class="bi transaction-icon"></i>
          <div>
            <div class="transaction-title"></div>
            <div class="transaction-meta text-muted small"></div>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="transaction-amount fw-semibold"></span>
          <span class="status-badge transaction-status"></span>
          <i class="bi bi-chevron-down"></i>
        </div>
      </div>
      <div class="transaction-detail collapse">
        <div class="detail-fields small text-muted mb-2"></div>
        <div class="timeline-container"></div>
        <div class="refund-section mt-3"></div>
        <div class="inspector-container mt-2"></div>
      </div>
    </div>
  </template>

  <div class="modal fade" id="receipt-modal" tabindex="-1" aria-labelledby="receipt-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="receipt-modal-title">Payment Receipt</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="receipt-modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../frontend-shared/app-mode.js"></script>
  <script src="../frontend-shared/lifecycle-timeline.js"></script>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Payment - Payment Processing</title>
  <link rel="stylesheet" href="../frontend-shared/design-tokens.css">
</head>
<body>
  <div class="container">
    <h1>New Payment</h1>

    <div class="card">
      <form id="new-payment-form">
        <label for="sourceAccount">Source Account</label>
        <input type="text" id="sourceAccount" name="sourceAccount" required>

        <label for="destinationAccount">Destination Account</label>
        <input type="text" id="destinationAccount" name="destinationAccount" required>

        <label for="amount">Amount (INR)</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0.01" required>

        <label for="currency">Currency</label>
        <input type="text" id="currency" name="currency" value="INR" maxlength="3" required>

        <label for="idempotencyKey">Idempotency Key</label>
        <input type="text" id="idempotencyKey" name="idempotencyKey" required>

        <div id="form-error" class="error-message" hidden></div>

        <button type="submit">Create Payment</button>
      </form>
    </div>

    <div class="card" id="result-card" hidden>
      <h2>Payment Created</h2>
      <p>Payment ID: <span id="result-id"></span></p>
      <p>Status: <span id="result-status" class="status-badge"></span></p>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>

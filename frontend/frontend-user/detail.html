<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Detail - Payment Processing</title>
  <link rel="stylesheet" href="../frontend-shared/design-tokens.css">
</head>
<body>
  <div class="container">
    <h1>Payment Detail</h1>

    <div class="card">
      <label for="paymentId">Payment ID</label>
      <input type="text" id="paymentId" name="paymentId" placeholder="Enter a payment id">
      <button id="load-payment-btn" type="button">Load Payment</button>
    </div>

    <div class="card" id="detail-card" hidden>
      <h2>Details</h2>
      <p>Source Account: <span id="detail-source"></span></p>
      <p>Destination Account: <span id="detail-destination"></span></p>
      <p>Amount: <span id="detail-amount"></span> <span id="detail-currency"></span></p>
      <p>Status: <span id="detail-status" class="status-badge"></span></p>
      <p>Type: <span id="detail-type"></span></p>

      <button id="refund-btn" class="danger" hidden>Refund</button>
      <div class="card" id="refund-form" hidden>
        <label for="refund-amount">Refund Amount</label>
        <input type="number" id="refund-amount" name="refund-amount" min="0.01" step="0.01">
        <label for="refund-reason">Reason (optional)</label>
        <input type="text" id="refund-reason" name="refund-reason">
        <button id="submit-refund-btn" type="button">Submit Refund</button>
      </div>
      <div id="refund-error" class="error-message" hidden></div>
    </div>
  </div>

  <script src="detail.js"></script>
</body>
</html>

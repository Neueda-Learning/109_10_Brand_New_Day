services:
  # NOTE: application.properties in the current local dev environment connects as
  # root/n3u3da! against a native MySQL install, NOT these payment_app/payment_app /
  # root/root credentials. This is a known, deliberate local-dev divergence (not a
  # bug) - if you use this compose file's MySQL container, update
  # backend/src/main/resources/application.properties to match the credentials below.
  mysql:
    image: mysql:8.0
    container_name: bnd-pp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: payment_processing
      MYSQL_USER: payment_app
      MYSQL_PASSWORD: payment_app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - bnd-pp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bnd-pp-mysql-data:

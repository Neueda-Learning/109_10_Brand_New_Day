# Full deployment stack (replaces the old MySQL-only local-dev compose - see
# README.md's CI/CD section / spec.md Section 20). Credentials here now match
# backend/src/main/resources/application.properties (root/n3u3da!) exactly, closing
# the divergence the previous version of this file used to document.
#
# For plain local iterative development without Docker, `mvn spring-boot:run` /
# `.\mvnw.cmd spring-boot:run` against a standalone MySQL is still fully supported -
# this compose file is for running/deploying the built GHCR images end to end.
services:
  mysql:
    image: mysql:8.4
    container_name: bnd-pp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: n3u3da!
      MYSQL_DATABASE: payment_processing
    ports:
      - "3306:3306"
    volumes:
      - bnd-pp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pn3u3da!"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/neueda-learning/bnd-api:latest
    container_name: bnd-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_processing
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: n3u3da!
    ports:
      - "8082:8080"

  ui:
    image: ghcr.io/neueda-learning/bnd-ui:latest
    container_name: bnd-ui
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"
    pull_policy: always

volumes:
  bnd-pp-mysql-data:

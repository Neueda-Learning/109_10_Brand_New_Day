name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: n3u3da!
          MYSQL_DATABASE: payment_processing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pn3u3da!"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build and Run Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/payment_processing
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: n3u3da!
        run: ./mvnw clean verify

      - name: Login to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t ghcr.io/neueda-learning/bnd-api:latest .

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/neueda-learning/bnd-api:latest

      - name: Trigger Jenkins CD
        if: github.event_name == 'push'
        run: |
          curl -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/bnd-api-deploy-job/build"
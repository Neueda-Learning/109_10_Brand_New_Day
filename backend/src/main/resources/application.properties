spring.application.name=payment-processing

# Datasource - local MySQL (see docker-compose.yml at repo root)
# NOTE: these credentials (root/n3u3da!) intentionally target a native local MySQL
# install, not the payment_app/payment_app user provisioned by docker-compose.yml's
# mysql service. This is a known, deliberate local-dev divergence (not a bug) - if you
# run the app against the docker-compose MySQL container instead, update these three
# lines to spring.datasource.username=payment_app / password=payment_app.
spring.datasource.url=jdbc:mysql://localhost:3306/payment_processing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=n3u3da!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Load schema.sql then data.sql against the datasource on every startup (Section 11.5)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

server.port=8080

# springdoc-openapi
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.application.name=payment-processing

# Datasource - local MySQL (see docker-compose.yml at repo root)
spring.datasource.url=jdbc:mysql://localhost:3306/payment_processing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=payment_app
spring.datasource.password=payment_app
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Load schema.sql then data.sql against the datasource on every startup (Section 11.5)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

server.port=8080

# springdoc-openapi
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
